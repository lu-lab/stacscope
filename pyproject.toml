[project]
name = "stacscope"
version = "0.1.0"
description = "Synchronous Timing, Asynchronous Control & Streaming for microscopy"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
nidaqmx = [
    "nidaqmx>=1.6.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
