[project]
name = "stacscope"
version = "0.1.0"
description = "Synchronous Timing, Asynchronous Control & Streaming for microscopy"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "msgpack>=1.2.2",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
nidaqmx = [
    "nidaqmx>=1.6.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Device-specific tests are skipped over, not skipped: `tests/adapters/<vendor>/`
# needs that vendor's package installed, and a future `tests/hardware/` would
# actuate the instrument. Whoever is developing that adapter runs the directory
# directly; nobody else ever collects it. An --ignore list rather than a
# testpaths allowlist, so a new directory of ordinary tests is picked up without
# anyone remembering to add it here.
addopts = ["--ignore=tests/adapters", "--ignore=tests/hardware", "--ignore=tests/tools"]
asyncio_mode = "auto"
# Virtual time never expires on its own: a missing reply would hang, not fail.
timeout = 10

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]
